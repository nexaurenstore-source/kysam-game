name: Build Kysam Game Android

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build with Godot
        uses: firebelley/godot-export@v6.1.0
        with:
          godot_executable_download_url: https://downloads.godotengine.org/4.5.1/Godot_v4.5.1-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://downloads.godotengine.org/4.5.1/Godot_v4.5.1-stable_export_templates.tpz
          relative_project_path: ./
          archive_output: true
          export_preset: Android

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KysamGame-Android
          path: build/Android/*
          if-no-files-found: error
