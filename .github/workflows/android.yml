name: Build Kysam Game Android

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.1
          use-dotnet: false
          include-templates: true

      - name: Export Android APK
        run: |
          mkdir -p build/Android
          godot --headless --path . --editor --quit
          godot --headless --path . --export-debug "Android" build/Android/KysamGame.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KysamGame-Android
          path: build/Android/KysamGame.apk
          if-no-files-found: error
